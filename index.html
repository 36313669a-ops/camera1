<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>遇見東北角 拍照濾鏡</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      color: white;
    }

    .camera-container {
      position: relative;
      width: 360px;
      height: 480px;
      background: black;
      overflow: hidden;
      border-radius: 20px;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    /* 白色相框 */
    .frame {
      position: absolute;
      inset: 15px;
      border: 12px solid white;
      border-radius: 25px;
      pointer-events: none;
      box-sizing: border-box;
      z-index: 5;
    }

    /* 右下角文字 */
    .frame-text {
      position: absolute;
      right: 35px;
      bottom: 35px;
      font-size: 20px;
      font-weight: 900;
      color: #111;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 10px;
      border-radius: 10px;
      z-index: 6;
      pointer-events: none;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>
  <h2>📷 遇見東北角 拍照濾鏡</h2>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay"></canvas>

    <div class="frame"></div>
    <div class="frame-text">遇見東北角</div>
  </div>

  <button id="captureBtn">📸 拍照下載</button>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    const captureBtn = document.getElementById("captureBtn");

    let detector;

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve();
      });
    }

    async function loadFaceDetector() {
      const { FaceDetector, FilesetResolver } = vision;

      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      detector = await FaceDetector.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
        },
        runningMode: "VIDEO"
      });
    }

    function resizeCanvas() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    async function detectLoop() {
      if (!detector) return;

      resizeCanvas();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const results = detector.detectForVideo(video, performance.now());

      if (results.detections) {
        results.detections.forEach((detection) => {
          const box = detection.boundingBox;

          ctx.strokeStyle = "lime";
          ctx.lineWidth = 4;
          ctx.strokeRect(box.originX, box.originY, box.width, box.height);
        });
      }

      requestAnimationFrame(detectLoop);
    }

    // 拍照下載
    captureBtn.addEventListener("click", () => {
      const photoCanvas = document.createElement("canvas");
      const pctx = photoCanvas.getContext("2d");

      photoCanvas.width = video.videoWidth;
      photoCanvas.height = video.videoHeight;

      // 因為 video 是鏡像，所以拍照要反轉回來
      pctx.save();
      pctx.translate(photoCanvas.width, 0);
      pctx.scale(-1, 1);
      pctx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      pctx.restore();

      // 畫白色相框
      const framePadding = 30;
      const frameThickness = 20;

      pctx.strokeStyle = "white";
      pctx.lineWidth = frameThickness;
      pctx.strokeRect(
        framePadding,
        framePadding,
        photoCanvas.width - framePadding * 2,
        photoCanvas.height - framePadding * 2
      );

      // 畫右下角文字
      pctx.font = "bold 48px Microsoft JhengHei";
      pctx.fillStyle = "rgba(255,255,255,0.75)";
      const text = "遇見東北角";
      const textWidth = pctx.measureText(text).width;

      const tx = photoCanvas.width - textWidth - 80;
      const ty = photoCanvas.height - 80;

      // 文字底色白半透明
      pctx.fillRect(tx - 20, ty - 60, textWidth + 40, 80);

      // 黑色粗體字
      pctx.fillStyle = "#111";
      pctx.fillText(text, tx, ty);

      // 下載
      const link = document.createElement("a");
      link.download = "遇見東北角-拍照.png";
      link.href = photoCanvas.toDataURL("image/png");
      link.click();
    });

    async function main() {
      await setupCamera();
      await loadFaceDetector();
      detectLoop();
    }

    main();
  </script>
</body>
</html>
