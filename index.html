<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>拍立得濾鏡 - 遇見東北角</title>
  <link rel="stylesheet" href="style.css">

  <!-- 手寫鋼筆字體（Google Fonts） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body>

  <h2 class="title">📸 拍立得相機濾鏡</h2>

  <!-- 引導授權 Overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="spinner"></div>
      <h3 id="overlayTitle">正在啟動相機...</h3>
      <p id="overlayText">請稍候，系統將請求相機授權。</p>
      <p class="tip">若瀏覽器跳出提示，請點選「允許」。</p>
    </div>
  </div>

  <!-- 拍立得框 -->
  <div class="polaroid">
    <canvas id="canvas"></canvas>
    <div class="caption">遇見東北角</div>
  </div>

  <!-- 控制按鈕 -->
  <div class="controls">
    <button id="startBtn">啟動相機</button>
    <button id="captureBtn" disabled>拍照</button>
    <a id="downloadLink" style="display:none;" download="polaroid.jpg">下載照片 (JPG)</a>
  </div>

  <p id="faceStatus">尚未啟動相機</p>

  <video id="video" autoplay playsinline style="display:none;"></video>

  <!-- MediaPipe Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

  <script src="script.js"></script>
</body>
</html>
