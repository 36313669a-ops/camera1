<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>遇見東北角 拍照濾鏡</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      color: white;
    }

    .camera-container {
      position: relative;
      width: 360px;
      height: 480px;
      background: black;
      overflow: hidden;
      border-radius: 20px;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none; /* 預設先隱藏 */
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .frame {
      position: absolute;
      inset: 15px;
      border: 12px solid white;
      border-radius: 25px;
      pointer-events: none;
      box-sizing: border-box;
      z-index: 5;
    }

    .frame-text {
      position: absolute;
      right: 35px;
      bottom: 35px;
      font-size: 20px;
      font-weight: 900;
      color: #111;
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 10px;
      border-radius: 10px;
      z-index: 6;
      pointer-events: none;
    }

    button {
      margin-top: 12px;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    button:hover {
      background: #ddd;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
      max-width: 360px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h2>📷 遇見東北角 拍照濾鏡</h2>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div class="frame"></div>
    <div class="frame-text">遇見東北角</div>
  </div>

  <button id="startBtn">🎥 開啟相機</button>
  <button id="captureBtn" disabled>📸 拍照下載</button>

  <div class="msg" id="msg">請先點「開啟相機」，手機才會跳出授權。</div>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const msg = document.getElementById("msg");

    let detector;

    async function loadFaceDetector() {
      const { FaceDetector, FilesetResolver } = vision;

      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );

      detector = await FaceDetector.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
        },
        runningMode: "VIDEO"
      });
    }

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    async function detectLoop() {
      if (!detector) return;

      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const results = detector.detectForVideo(video, performance.now());

      if (results.detections) {
        results.detections.forEach((detection) => {
          const box = detection.boundingBox;
          ctx.strokeStyle = "lime";
          ctx.lineWidth = 4;
          ctx.strokeRect(box.originX, box.originY, box.width, box.height);
        });
      }

      requestAnimationFrame(detectLoop);
    }

    startBtn.addEventListener("click", async () => {
      try {
        msg.textContent = "正在啟動相機...";
        await setupCamera();
        await loadFaceDetector();

        video.style.display = "block";
        captureBtn.disabled = false;

        msg.textContent = "相機已啟動！你可以拍照了。";
        detectLoop();
      } catch (err) {
        msg.textContent = "❌ 無法開啟相機，請確認你有允許相機權限。";
        console.error(err);
      }
    });

    captureBtn.addEventListener("click", () => {
      const photoCanvas = document.createElement("canvas");
      const pctx = photoCanvas.getContext("2d");

      photoCanvas.width = video.videoWidth;
      photoCanvas.height = video.videoHeight;

      // 修正鏡像
      pctx.save();
      pctx.translate(photoCanvas.width, 0);
      pctx.scale(-1, 1);
      pctx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      pctx.restore();

      // 白框
      const framePadding = 30;
      const frameThickness = 20;

      pctx.strokeStyle = "white";
      pctx.lineWidth = frameThickness;
      pctx.strokeRect(
        framePadding,
        framePadding,
        photoCanvas.width - framePadding * 2,
        photoCanvas.height - framePadding * 2
      );

      // 文字
      pctx.font = "bold 48px Microsoft JhengHei";
      const text = "遇見東北角";
      const textWidth = pctx.measureText(text).width;

      const tx = photoCanvas.width - textWidth - 80;
      const ty = photoCanvas.height - 80;

      pctx.fillStyle = "rgba(255,255,255,0.75)";
      pctx.fillRect(tx - 20, ty - 60, textWidth + 40, 80);

      pctx.fillStyle = "#111";
      pctx.fillText(text, tx, ty);

      // 下載
      const link = document.createElement("a");
      link.download = "遇見東北角-拍照.png";
      link.href = photoCanvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
