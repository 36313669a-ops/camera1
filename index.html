<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>拍立得濾鏡 - 遇見東北角</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2 class="title">📸 拍立得相機濾鏡</h2>

  <div class="polaroid">
    <canvas id="canvas"></canvas>
    <div class="caption">遇見東北角</div>
  </div>

  <div class="controls">
    <button id="startBtn">啟動相機</button>
    <button id="captureBtn" disabled>拍照</button>
    <a id="downloadLink" style="display:none;" download="polaroid.jpg">下載照片</a>
  </div>

  <p id="faceStatus">尚未啟動相機</p>

  <video id="video" autoplay playsinline style="display:none;"></video>

  <!-- MediaPipe Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script src="script.js"></script>
</body>
</html>
